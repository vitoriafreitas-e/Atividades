<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de produto interativo</title>
    <link rel="stylesheet" href="atividade03.css">
</head>
<body>
    <main class="container">
        <article class="card">
            <div class="card-image-container">
                <span class="badge">Novo</span>
                <img src="https://lojamultilaser.vtexassets.com/arquivos/ids/1533277-800-auto?v=638961564339900000&width=800&height=auto&aspect=true" alt="Fone de Ouvido Bluetooth"
                class="card-image">
            </div>
            <div class="card-content">
                <span class="category">Aúdio & Acessórios</span>
                <h2 class="title">Fone Bluetooth Pro</h2>
                <p class="description">
                    Cancelamento ativo de ruído, bateria de até 30 horas 
                    e acabamento premium para seu dia a dia.
                </p>
            
            <div class="card-footer">
                <div class="price-container">
                    <span class="price-label">Preço</span>
                    <span class="price">R$ 299,90</span>
                </div>
                <button class="btn">Comprar</button>
            </div>
            </div>
        </article>
    </main>
</body>
</html>
