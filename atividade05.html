<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro</title>
    <link rel="stylesheet" href="atividade05.css">
</head>
<body>
    <main class="stopwatch-card">
        <h2>Cronômetro</h2>
        <div class="time-display" id="display">00:00:00</div>
        <!---->
        <div class="controls">
            <button id="start-btn" class="btn primary">Iniciar</button>
            <button id="lap-btn" class="btn secondary" disabled>Volta</button>
            <button id="reset-btn"  class="btn secondary" disabled>Zerar</button>
        </div>
        <!---->
        <div class="laps-container">
            <h3>Voltas</h3>
            <ul id="laps-list"></ul>
        </div>
    </main>
    <script src="atividade05.js"></script>
</body>
</html>
