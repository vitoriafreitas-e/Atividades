<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="atividade01.css">
    <script src="atividade01.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>gerador de senhas</h2>
    <div class="result-container">
        <span id="result">P4ssw0rd!</span>
        <button class="btn" id="clipboard" title="Copiar senha">
            📋
        </button>
    </div>

    <div class="options">
        <div class="option">
            <label for="length">Tamanho da senha</label>
            <input type="number" id="length" min="4" max="30" value="12">
        </div>
        <div class="option">
            <label for="uppercase">Incluir maiúsculas</label>
            <input type="checkbox" id="uppercase" checked>
        </div>
        <div class="option">
            <label for="lowercase">Incluir minusculas</label>
            <input type="checkbox" id="lowercase">
        </div>
        <div class="option">
            <label for="numbers">Incluir numeros</label>
            <input type="checkbox" id="numbers" checked>
        </div>
        <div class="option">
            <label for="symbols">Incluir simbolos</label>
            <input type="checkbox" id="symbols" checked>
        </div>
    </div>
    <button class="btn btn-large" id="generate">
        Gerar senha
    </button>
    </div>
</body>
</html>
